spring.application.name=spring-boot-api

# The whole database configuration is these four lines plus a starter on the
# classpath. The NestJS equivalent is an explicit module with a factory in it.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payments_spring}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:payments}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:payments}

# The rough equivalent of TypeORM's synchronize: true. Development only, and
# the episode says so out loud. Migrations are a later episode.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Spring's default is IMMEDIATE shutdown, not graceful. Measured 2026-09-19:
# an in-flight request was lost on SIGTERM. This is the Java side's half of the
# same lesson, and it is one line that almost nobody sets.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
