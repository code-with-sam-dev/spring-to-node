# TESTS RUN ON THE HOST, NOT INSIDE COMPOSE.
#
# The application's own default is localhost:5432, which is correct inside the
# compose network and wrong for a test running on the host whenever the
# database has been published on another port. compose.yaml publishes
# ${POSTGRES_PORT:-5432}, and the machine this was built on sets 5434 in .env
# because 5432 was already taken.
#
# WHY THIS IS WORTH A FILE RATHER THAN A REMEMBERED EXPORT: pointing at the
# wrong port does NOT present as a connection error. Another Postgres answers,
# rejects the payments user, and the failure reads
# "password authentication failed", which sends you to look at credentials that
# were never wrong. That cost time twice.
#
# Maven does not read .env, so export POSTGRES_PORT, or run the tests through
# scripts/test-spring.sh which sources it.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/payments_spring}

# AND THE CREDENTIALS, because a test application.properties does not MERGE
# with the main one for a given key: declaring only the url here left the
# username and password unset, and the failure changed from "password
# authentication failed" to "the server requested SCRAM-based authentication,
# but no password was provided". Two different messages, both meaning the
# datasource was not configured the way it looked.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:payments}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:payments}
